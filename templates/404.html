{% extends "base.html" %} {% block title %}Page Not Found{% endblock %} {% block
content %}

<section class="flex min-h-[70vh] items-center justify-center px-4">
  <div class="max-w-xl text-center">
    <p class="text-sm font-bold uppercase tracking-widest text-blue-600">
      Error 404
    </p>

    <h1 class="mt-3 text-5xl font-black tracking-tight text-slate-900">
      Page Not Found
    </h1>

    <p class="mt-4 text-slate-600">
      The page you are looking for does not exist or may have been moved.
    </p>

    <div class="mt-8 flex justify-center gap-3">
      <a
        href="{% url 'home' %}"
        class="rounded-md bg-blue-600 px-5 py-3 text-sm font-bold text-white hover:bg-blue-500"
      >
        Back to Home
      </a>

      <a
        href="{% url 'venue' %}"
        class="rounded-md border border-slate-300 bg-white px-5 py-3 text-sm font-bold text-slate-700 hover:bg-slate-100"
      >
        View Events
      </a>
    </div>
  </div>
</section>

{% endblock %}
