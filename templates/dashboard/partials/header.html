<header class="sticky top-0 z-30 border-b border-gray-200 bg-white">
    <div class="flex h-16 items-center justify-between px-6 lg:px-8">

        <!-- Left -->
        <div>
            <h1 class="text-lg font-semibold text-gray-900">
                Dashboard
            </h1>

            <p class="text-xs text-gray-500">
                Welcome back, {{ request.user.username }}
            </p>
        </div>

        <!-- Right -->
        <div class="flex items-center gap-4">

            <!-- Notification -->
            <button
                type="button"
                class="relative rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-700"
                aria-label="Notifications"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M14.857 17.082a23.848 23.848 0 0 1-5.714 0A8.967 8.967 0 0 0 10.5 16.5V11a1.5 1.5 0 1 1 3 0v5.5c.44.15.892.344 1.357.582ZM9 17.5h6M10 20h4"
                    />
                </svg>

                <span class="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-red-500"></span>
            </button>


            <!-- User -->
            <div class="flex items-center gap-3">

                <!-- Avatar -->
                <div class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-100">
                    <span class="text-sm font-semibold text-indigo-600">
                        {{ request.user.username|first|upper }}
                    </span>
                </div>

                <!-- User info -->
                <div class="hidden sm:block">
                    <p class="text-sm font-medium text-gray-900">
                        {{ request.user.username }}
                    </p>

                    <p class="text-xs text-gray-500">
                        {{ request.user.email }}
                    </p>
                </div>

            </div>

        </div>

    </div>
</header>
