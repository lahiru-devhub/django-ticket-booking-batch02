<aside class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-gray-200 bg-white">

    <!-- Logo -->
    <div class="flex h-16 items-center border-b border-gray-200 px-6">
        <a href="{% url 'dashboard' %}" class="text-xl font-bold text-indigo-600">
            TicketApp
        </a>
    </div>


    <!-- Navigation -->
    <nav class="flex-1 space-y-1 overflow-y-auto p-4">

        <!-- Dashboard -->
        <a href="{% url 'dashboard' %}"
           class="flex items-center gap-3 rounded-lg bg-indigo-50 px-4 py-3 text-sm font-medium text-indigo-600">

            <svg class="h-5 w-5"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="1.8">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M3 12l9-9 9 9M5 10v10h14V10" />
            </svg>

            <span>Dashboard</span>
        </a>


        <!-- Book Ticket -->
        <a href="#"
           class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-indigo-600">

            <svg class="h-5 w-5"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="1.8">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2m-8 0h8m-9 4h10m-9 4h5m-7 5h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2z" />
            </svg>

            <span>Book Ticket</span>
        </a>


        <!-- My Tickets -->
        <a href="#"
           class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-indigo-600">

            <svg class="h-5 w-5"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="1.8">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M5 5h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z" />
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M7 9h10M7 13h6" />
            </svg>

            <span>My Tickets</span>
        </a>


        <!-- Profile -->
        <a href="#"
           class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-indigo-600">

            <svg class="h-5 w-5"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="1.8">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 19a4 4 0 00-8 0m4-8a4 4 0 100-8 4 4 0 000 8zm8 8v-1a4 4 0 00-3-3.87" />
            </svg>

            <span>Profile</span>
        </a>

    </nav>


    <!-- User / Logout -->
    <div class="border-t border-gray-200 p-4">

        <div class="mb-3 flex items-center gap-3">

            <!-- Avatar -->
            <div class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-100">
                <span class="text-sm font-semibold text-indigo-600">
                    {{ request.user.username|first|upper }}
                </span>
            </div>

            <!-- User Info -->
            <div class="min-w-0">
                <p class="truncate text-sm font-medium text-gray-900">
                    {{ request.user.username }}
                </p>

                <p class="truncate text-xs text-gray-500">
                    {{ request.user.email }}
                </p>
            </div>

        </div>


        <!-- Logout -->
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}

            <button
                type="submit"
                class="flex w-full items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-red-600 hover:bg-red-50">

                <svg class="h-5 w-5"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="1.8">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M15 12H3m0 0l4-4m-4 4l4 4m5-9V5a2 2 0 012-2h4a2 2 0 012 2v14a2 2 0 01-2 2h-4a2 2 0 01-2-2v-2" />
                </svg>

                <span>Logout</span>

            </button>

        </form>

    </div>

</aside>
