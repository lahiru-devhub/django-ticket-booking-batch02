{% load tailwind_tags %} {% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} Ticket Booking {% endblock%}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    {% tailwind_css %}

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body
    class="bg-slate-50 text-slate-900"
    style="
      font-family:
        &quot;Plus Jakarta Sans&quot;, &quot;Manrope&quot;, sans-serif;
    "
  >
    {% include "partials/navbar.html" %} {% block content %} {% endblock %}

    <script src="{% static 'js/home.js' %}"></script>

    {% include "partials/footer.html" %}
  </body>
</html>
