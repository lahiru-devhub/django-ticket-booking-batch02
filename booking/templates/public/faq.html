{% extends "base.html" %}
{% block title %} FAQ {% endblock %}

{% block content %}
    <div class="max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold mb-4">Frequently Asked Questions</h2>
    <div class="space-y-4">
    <div class="border rounded-lg">
        <button class="w-full text-left p-4 font-medium bg-gray-100 hover:bg-gray-200">
        What is Tailwind CSS?
        </button>
        <div class="p-4 hidden">
        Tailwind CSS is a utility-first CSS framework for building custom designs quickly
        </div>
    </div>
    <div class="border rounded-lg">
        <button class="w-full text-left p-4 font-medium bg-gray-100 hover:bg-gray-200">
        How do I install Tailwind CSS?
        </button>
        <div class="p-4 hidden">
        You can install Tailwind CSS via npm, yarn, or a CDN link
        </div>
    </div>
 </div>
</div>
{% endblock %}
