{% extends "base.html" %}
{% block title %} Contact {% endblock %}

{% block content %}

<h1>{{ user_data.name}}</h1>
<h1>{{ user_data.email}}</h1>

    <section class="bg-gray-100 py-12">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
   <div class="text-center">
     <h2 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">Get in Touch</h2>
     <p class="mt-4 text-lg leading-6 text-gray-600">
       Have a question or want to work together? Fill out the form below
     </p>
   </div>
   <div class="mt-10 sm:mt-12">
     <form action="#" method="POST" class="max-w-xl mx-auto">
       <div class="grid grid-cols-1 gap-y-6">
         <!-- Name Field -->
         <div>
           <label for="name" class="sr-only">Name</label>
           <input
             type="text"
             name="name"
             id="name"
             placeholder="Your Name"
             required
             class="block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
           />
         </div>
         <!-- Email Field -->
         <div>
           <label for="email" class="sr-only">Email</label>
           <input
             type="email"
             name="email"
             id="email"
             placeholder="Your Email"
             required
             class="block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
           />
         </div>
         <!-- Message Field -->
         <div>
           <label for="message" class="sr-only">Message</label>
           <textarea
             name="message"
             id="message"
             rows="4"
             placeholder="Your Message"
             required
             class="block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
           ></textarea>
         </div>
         <!-- Submit Button -->
         <div>
           <button
             type="submit"
             class="w-full inline-flex justify-center py-3 px-6 border border-transparent shadow-sm text-base font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
           >
             Send Message
           </button>
         </div>
       </div>
     </form>
   </div>
 </div>
</section>
{% endblock %}
