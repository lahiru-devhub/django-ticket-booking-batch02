{% extends "base.html" %} {% block content %}
<section class="min-h-[calc(100vh-12rem)] bg-gray-100 py-12">
  <div class="mx-auto max-w-3xl px-4 sm:px-6 lg:px-8">
    <div class="border border-gray-200 bg-white shadow-sm">
      <div class="border-b border-gray-200 px-6 py-5">
        <h1 class="text-2xl font-extrabold text-gray-900">Event Support</h1>
        <p class="mt-1 text-sm text-gray-600">
          Ask about published events, venues, ticket availability, or prices.
        </p>
      </div>
      <div
        id="chat-messages"
        class="min-h-80 space-y-4 px-6 py-6"
        aria-live="polite"
      >
        <div class="max-w-xl bg-indigo-50 px-4 py-3 text-sm text-indigo-950">
          Hello! How can I help with an event today?
        </div>
      </div>
      <form id="chat-form" class="border-t border-gray-200 p-4">
        {% csrf_token %}
        <label for="chat-message" class="sr-only">Your question</label>
        <div class="flex gap-3">
          <input
            id="chat-message"
            name="message"
            maxlength="1000"
            required
            autocomplete="off"
            placeholder="Ask a question about an event"
            class="min-w-0 flex-1 border border-gray-300 px-4 py-3 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
          />
          <button
            id="chat-submit"
            type="submit"
            class="bg-indigo-600 px-5 py-3 text-sm font-semibold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-indigo-300"
          >
            Send
          </button>
        </div>
        <p
          id="chat-error"
          class="mt-2 hidden text-sm text-red-600"
          role="alert"
        ></p>
      </form>
    </div>
  </div>
</section>

<script>
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-message");
  const messages = document.getElementById("chat-messages");
  const submitButton = document.getElementById("chat-submit");
  const error = document.getElementById("chat-error");

  function addMessage(text, className) {
    const message = document.createElement("div");
    message.className = "max-w-xl px-4 py-3 text-sm " + className;
    message.textContent = text;
    messages.appendChild(message);
    messages.scrollTop = messages.scrollHeight;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    const formData = new FormData(form);
    error.classList.add("hidden");
    addMessage(question, "ml-auto bg-gray-900 text-white");
    input.value = "";
    input.disabled = true;
    submitButton.disabled = true;

    try {
      const response = await fetch("{% url 'support_chat' %}", {
        method: "POST",
        headers: {
          "X-CSRFToken": form.querySelector("[name=csrfmiddlewaretoken]").value,
        },
        body: formData,
      });
      const payload = await response.json();
      if (!response.ok)
        throw new Error(payload.error || "Unable to get a reply.");
      addMessage(payload.reply, "bg-indigo-50 text-indigo-950");
    } catch (requestError) {
      error.textContent = requestError.message;
      error.classList.remove("hidden");
    } finally {
      input.disabled = false;
      submitButton.disabled = false;
      input.focus();
    }
  });
</script>
{% endblock %}
